name: 功能建議
description: 提出新功能、改善方向或使用體驗建議
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        歡迎提出想法。

        我們會依照專案方向、維護成本、相容性與實際需求評估是否採納。
        提交建議不代表該功能一定會實作或排入時程。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前確認
      options:
        - label: 我已搜尋現有 Issue，沒有找到相同或高度相關的建議。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 請描述目前遇到的限制、需求或使用情境。
      placeholder: 我希望能夠……，因為目前……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 描述你希望看到的功能或行為。不需要提供完整技術設計。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果你曾考慮其他做法、替代工具或 workaround，可以在這裡補充。

  - type: textarea
    id: additional
    attributes:
      label: 補充資訊
      description: 可附上範例、截圖、設計稿、相關連結或其他背景資訊。