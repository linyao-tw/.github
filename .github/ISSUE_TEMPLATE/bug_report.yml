name: Bug 回報
description: 回報可重現的錯誤、異常行為或功能問題
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝你協助我們改善專案。

        提交前，請先確認是否已有相同或相關的 Issue。
        如果問題涉及安全漏洞，請勿公開回報，請依照專案的 `SECURITY.md` 處理。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前確認
      options:
        - label: 我已搜尋現有 Issue，沒有找到相同問題。
          required: true
        - label: 我使用的是目前仍受支援的版本。
          required: true

  - type: textarea
    id: description
    attributes:
      label: 問題描述
      description: 請簡潔描述發生了什麼，以及你原本預期的結果。
      placeholder: |
        實際發生：
        預期結果：
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 重現方式
      description: 請提供能穩定重現問題的最少步驟。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 執行環境
      description: 請提供與問題相關的版本、作業系統、瀏覽器、Runtime 或其他環境資訊。
      placeholder: |
        - 專案版本：
        - 作業系統：
        - 瀏覽器 / Runtime：
        - 其他：
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補充資訊
      description: 可附上截圖、錯誤訊息、Log、最小重現專案或其他相關資訊。